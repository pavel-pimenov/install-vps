[project]
name = "install-vps"
version = "0.1.0"
description = "Автоматизация стартовой настройки новой VPS (Ubuntu 26.04) по SSH-ключу"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
install-vps = "install_vps.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["install_vps"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "PL"]