# Конфиг для install-vps (боевой хост dev.fly-server.ru).
# Ключи CLI перекрывают значения из этого файла.

host = "dev.fly-server.ru"
user = "root"
port = 22
key_path = "~/.ssh/id_ed25519"
accept_new = true

packages = ["nload", "htop", "btop", "mc", "git", "procps", "docker.io",
            "docker-compose-v2", "fail2ban", "ncdu", "logrotate"]

# Источник docker: "ubuntu" (docker.io + docker-compose-v2 из архивов Ubuntu)
# или "official" (docker-ce с download.docker.com).
docker_source = "ubuntu"

# Файл подкачки в МБ; 0 — не создавать. Уже созданный /swapfile не меняется.
swap_size_mb = 512

# Утилиты, которых нет в репозиториях Ubuntu: ставятся из релизов GitHub
# с закреплённой версией и проверкой sha256 в /usr/local/bin.
# tools = ["lazydocker", "bandwhich"]

# Мониторинг Beszel. По умолчанию beszel_mode = "hub": Hub + Agent на одной
# машине (docker compose, порт 8090). На узле без своего хаба ставьте
# beszel_mode = "agent" — тогда поднимается только beszel-agent (порт 45876),
# а хаб с другого сервера стучится к нему; ключ/токен такого агента выдаёт
# веб-UI центрального хаба (Add system).
beszel = true
beszel_port = 8090
# Образы henrygd/beszel и henrygd/beszel-agent жёстко запинены (hub и agent
# должны быть одной версии, «latest» ломает пару при обновлении образа):
# beszel_version = "0.20.0"
# beszel_mode = "agent"
# Порт агента, если он отличается от 45876:
# beszel_agent_port = 45876
# Открыть порт агента только этим хостам (правила пишутся при активном ufw;
# при выключенном ufw скрипт предупредит, что правило не сработало):
# beszel_agent_allow = ["185.50.202.219/32"]
# Ключ и токен агента намеренно НЕ хранятся здесь: они выдаются веб-UI Hub
# (Add system) и являются секретом. Если их не передать флагами, install-vps
# сохранит уже настроенные на хосте значения (иначе повторный прогон тихо
# сломал бы мониторинг).
# beszel_agent_key = "ssh-ed25519 AAAA..."
# beszel_agent_token = "xxxx-xxxx-xxxx-xxxx"
# Если провайдер узла режет входящие порты (обычно высокие — 45876), укажите
# публичный адрес хаба: агент сам подключится к нему исходящим
# WebSocket-соединением, и порт агента наружу открывать не нужно:
# beszel_hub_url = "https://monitor.example.com"
# Вход через OAuth без пароля (провайдер настраивается в веб-UI Hub):
# beszel_user_creation = true
# beszel_disable_password_auth = true   # только вместе с user_creation!

# Portainer CE. В режиме "server" (по умолчанию) ставится сам сервер: UI на
# 127.0.0.1:9443 (наружу его отдаёт Caddy на portainer_domain) плюс порт
# туннеля 8000, к которому подключаются edge-агенты. Отдельный домен
# обязателен: под базовым путём портала Portainer не работает, поэтому в портал
# добавляется внешняя плитка «Контейнеры».
# portainer = true
# portainer_domain = "portainer.example.com"
# На узле — только edge-агент, он сам ходит в хаб и входящих портов не открывает.
# Нужны EDGE_ID и EDGE_KEY окружения: UI Portainer -> Environments -> нужное
# окружение -> Edge agent standard. Домен задавать не обязательно — адрес сервера,
# порт туннеля и отпечаток chisel лежат внутри ключа; если portainer_domain всё
# же задан, install-vps проверит, что ключ из того же Portainer.
# Пустые значения прежний ключ не затирают, но проверка скажет, что агент не
# зарегистрируется.
# portainer = true
# portainer_mode = "agent"
# portainer_agent_edge_id = "3c0b1d6e-...."        # UUID
# portainer_agent_edge_key = "aHR0cHM6Ly9wb3J0..." # base64 целиком
# Версии образов: сервер и агенты должны совпадать.
# portainer_version = "2.45.1"
# Порт туннеля ВНУТРИ контейнера сервера: он попадает в EDGE_KEY, и агент идёт
# на <домен>:<порт>. Значение 80 нужно, чтобы туннель шёл через Caddy (агент
# умеет только ws://), наружу он публикуется на 127.0.0.1:8000.
# portainer_tunnel_port = 80

# Сжатый своп zram поверх обычного swapfile: на VPS с 512M-1024M RAM заметно
# отзывчивее (сначала уходит в zram, приоритет 100, swapfile — вторая ступень).
zram_size_mb = 256

# Dozzle: логи контейнеров в браузере. Живёт под базовым путём портала
# (DOZZLE_BASE, поэтому прокси сохраняет префикс), слушает только 127.0.0.1 —
# наружу его отдаёт Caddy. Плитка «Логи» на портале появляется сама.
dozzle = true
dozzle_port = 8082
dozzle_path = "/logs"
dozzle_user = "admin"
# Пароль: не задан — сгенерируется на хосте и покажется в выводе один раз,
# users.yml больше не перезаписывается. Задать свой (и сбросить старый):
# dozzle_password = "..."
# Вход обязателен: docker.sock в доступе dozzle равносилен root на хосте,
# поэтому actions и shell выключены, а аватары и аналитика отключены.
# Если задан portal_password, свой вход Dozzle не создаётся вовсе.

# Лимит systemd-журнала: /etc/systemd/journald.conf.d/10-size-limit.conf
journald_max_use = "100M"

# Ротация логов контейнеров в /etc/docker/daemon.json
docker_log_max_size = "10m"
docker_log_max_file = "3"

# --- Caddy: автоматический HTTPS (Let's Encrypt) -----------------------------
# Caddy занимает 80/443 на хосте (network_mode: host) и проксирует на локальные
# порты. A-записи доменов уже указывают на хост.
caddy = true
caddy_email = "pavel.pimenov@gmail.com"

# Портал: https://dev.fly-server.ru/ — страница с плитками сервисов.
caddy_portal = "dev.fly-server.ru"
caddy_portal_title = "Сервисы"
# Единый вход на портал (HTTP basic): браузер спрашивает логин/пароль один раз,
# дальше все плитки открываются без форм. Собственная форма входа Dozzle при
# этом выключается — её заменяет пароль портала.
# Пароль НЕ хранится в этом файле (репозиторий виден всем): держите его в
# локальной копии конфига, например config.local.toml (он в .gitignore), и
# запускайте install-vps с -c config.local.toml.
# portal_user = "admin"
# portal_password = "..."
# Плитки бывают двух видов:
#   "Название=https://домен"         — внешняя ссылка;
#   "Название=/путь=upstream"        — Caddy проксирует путь на локальный сервис
#     и срезает префикс (приложение видит "/"); четвёртое поле keep оставляет
#     префикс — для приложений, которые сами знают свой базовый путь.
# Проксирование под путём подходит НЕ всем приложениям. Beszel работает:
# install-vps прописывает Hub APP_URL вместе с путём, и он генерирует ссылки
# с префиксом (плитка мониторинга ниже появляется сама). ThinPro отдаёт
# /assets/... и /api/... от корня, поэтому под префиксом ломается — ему
# нужен собственный домен, как в примере ниже.
caddy_tiles = [
    "Мониторинг=https://monitor.fly-server.ru",
    "ThinPro=https://thinpro.fly-server.ru",
]

# Домен самого Beszel Hub. Пока он задан, автоплитка мониторинга на портале не
# добавляется — выше она описана ссылкой вручную.
caddy_domain = "monitor.fly-server.ru"
beszel_path = "/monitor"

# Сайты, которые Caddy отдаёт целиком: "домен=upstream".
# Каждый сайт — отдельный файл /opt/caddy/sites/*.caddy, корневой Caddyfile
# только импортирует их, так что новый сайт = одна строка здесь.
caddy_sites = [
    "thinpro.fly-server.ru=127.0.0.1:8080",
    # Сайт-статика: file:/каталог — Caddy отдаёт каталог сам, без прокси.
    # Опции после "|" повторяют то, что задавал lighttpd, с которого сайт
    # переезжает: browse — листинг каталогов, index — приоритет индексных
    # файлов, hide — что не показывать в листинге, deny — какие файлы не
    # отдавать вовсе (403). Без них сайт получится голым file_server.
    # "etc.fly-server.ru=file:/var/www/etc|browse|index=index.html,index.lighttpd.html|hide=.svn,*.lua",
]
# Страница портала: /opt/caddy/portal/index.html (генерируется из caddy_tiles).
# Перечитать конфиг: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
