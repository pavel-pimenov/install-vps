# Конфиг для install-vps.
# Ключи CLI перекрывают значения из этого файла.

host = ""                     # IP или DNS имя VPS
user = "root"                 # пользователь SSH
port = 22
key_path = "~/.ssh/id_ed25519"
accept_new = true             # автоматически добавить новый host в known_hosts

# Минимальный набор софта (можно переопределить через --packages)
# packages = ["nload", "htop", "btop", "mc", "git", "docker-compose-v2"]

# Мониторинг Beszel (Hub + Agent на одной машине, docker compose, порт 8090)
# beszel = true
# beszel_port = 8090
# Ключ и токен агента выдаёт веб-UI Hub: открыть http://<host>:8090, создать
# пользователя, Add system -> скопировать оба значения и перезапустить
# install-vps (повторный запуск идемпотентно добавит/пересоздаст агента).
# beszel_agent_key = "ssh-ed25519 AAAA..."
# beszel_agent_token = "xxxx-xxxx-xxxx-xxxx"

# Сжатый своп zram поверх обычного swapfile. На VPS с 512M-1024M RAM заметно
# отзывчивее: сначала уходит в zram (приоритет 100), swapfile — вторая ступень.
# zram_size_mb = 256

# Лимит systemd-журнала: /etc/systemd/journald.conf.d/10-size-limit.conf
# journald_max_use = "100M"

# Ротация логов контейнеров в /etc/docker/daemon.json (перезаписывает
# log-driver/log-opts, остальные ключи файла сохраняются)
# docker_log_max_size = "10m"
# docker_log_max_file = "3"

# Caddy — обратный прокси с автоматическим HTTPS (Let's Encrypt). Занимает
# 80/443 на хосте (network_mode: host) и проксирует на локальные порты.
# Перед включением создайте A-записи доменов на хост:
#   monitor.example.com  A  <ip-хоста>
#   thin.example.com     A  <ip-хоста>
# caddy = true
# caddy_email = "you@example.com"      # для уведомлений об истечении сертификата
# caddy_domain = "monitor.example.com" # домен для Beszel Hub
# Любые другие сайты — по одному на строку, "домен=upstream":
# caddy_sites = [
#     "thin.example.com=http://127.0.0.1:8080",
# ]
# Сайты пишутся отдельными файлами в /opt/caddy/sites/*.caddy и подключаются
# через import — новый сайт добавляется одним файлом, без правки Caddyfile.
# Перечитать конфиг: docker exec caddy caddy reload --config /etc/caddy/Caddyfile